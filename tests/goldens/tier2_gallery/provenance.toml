# Provenance of the Tier 2 full-image goldens (#37).
#
# These pin the published Ellien+2021 behaviour on the whole gallery
# image at the shipping CG max_iter. This is the science check: it runs
# at named carve checkpoints and nightly in CI (#19), not per commit.
# Regenerate only in a commit whose message says why the golden moved
# (#3).

[golden]
tier = 2
recorded_by = "Amaël Ellien"
recorded_on = "2026-08-24"
reason = "initial Tier 2 recording for #37"
ticket = "https://github.com/aellien/dawis-dev/issues/37"
wall_s = 1641.2

# The branch the goldens were recorded from: the published algorithm
# with the RNG pinned and the post-publication drifts reverted (#32).
[source]
repo = "dawis-dev"
branch = "legacy-seeded"
commit = "1434f66a9482c078f090f474f1ac3ae4b2682b47"
describe = "v0.0.7-h-5-g1434f66"
dirty = false
stubbed_modules = ["ray", "ultranest"]

# The whole gallery image, unsliced — there is no cutout convention to
# misread here, which is why Tier 2 records a digest of the packaged
# file instead of a second copy of it. The comparison checks the digest
# first, so a changed input fails loudly rather than shifting the golden
# silently.
[input]
image = "dawis/gallery/tidal_group_f814w_sci.fits"
image_shape = [900, 900]
image_dtype = ">f4"
image_sha256 = "26bce08195dee5216db87d23407692954de489356b64e37f251c9f18a1686463"
cutout = false

# cg_max_iter is the conjugate-gradient solver's cap inside
# interscale_tree.CG_minimization, and here it is A SCIENCE CLAIM, NOT A
# SPEED KNOB. 200 is the published Ellien+2021 value; 7c5ba8e cut it to 3
# in 2024 and #32 reverted that drift. At 200 the solver's sigma_flux
# convergence test is live rather than vestigial, and atom fluxes sit
# 25-29% higher than at 3 (#29). Tier 1 (#36) pins 3 because its job is
# catching structural breakage on a three-minute budget; this tier is the
# one that says the science is unchanged, so it is never lowered to fit a
# budget. It is still FORCED rather than inherited: the default is 200 on
# legacy-seeded but 3 on the tree the refactor branched from.
# pipeline_max_iter is the unrelated cap on the greedy outer loop.
[run]
seed = 20260823
n_cpus = 1
cg_max_iter = 200
cg_max_iter_default_in_source = 200
pipeline_max_iter = 500
n_iterations = 27
n_atoms = 463

# Every pipeline parameter with the value this run actually used,
# defaults resolved.
[config]
n_cpus = 1
starting_level = 2
tau = 0.1
n_levels = 9
n_sigmas = 5
deblend_contrast = 0.1
gamma = 0.5
min_span = 2
max_span = 3
lvl_sep_big = 5
rm_gamma_for_big = false
lvl_deblend = 3
outfile_format = "pickle"
extent_sep = 0.1
ecc_sep = 0.95
lvl_sep_lin = 2
lvl_sep_op = 3
ceps = 0.0001
scale_lvl_eps = 1
conditions = "loop"
deconv = false
max_iter = 500
size_patch = 100
inpaint_res = true
data_dump = false
gif = false
iptd_sigma = 3
resume = false
seed = 20260823

# The same rule as Tier 1, per #3: float tolerance on images and per-atom
# quantities, exact on atom and iteration counts, rtol=1e-5 with
# atol=1e-3*sigma on images and rtol=1e-4 per atom. The sigma is the
# robust sigma of THIS run's residual, so the absolute tolerance is a
# different number from Tier 1's while the rule producing it is the same.
# Never bit-for-bit: BLAS, OS and numpy versions move the last bits, and
# the one comparison that IS bit-identical by design is the
# parallel-consistency check (#57).
[tolerances]
residual_sigma = 0.0018638754007406534
image_atol = 1.8638754007406534e-06
image_rtol = 1e-05
atom_rtol = 0.0001
atom_atol = 0.0
convergence_rtol = 0.0001
convergence_atol = 0.0
exact = ["n_atoms", "n_iterations", "level", "bbox", "flag_convergence", "filter"]

# What this tier costs to run, recorded so checkpoint scheduling is
# planned from a measurement rather than a guess. #37 expected it to
# exceed #5's 3539 s baseline; it does not. #5 measured the drifted Wolfe
# restoration path with animation frames written inside the loop, and #33
# measured this configuration -- published CG path, gif off -- at 1167.6 s
# on this machine. wall_s above sits higher than that for two reasons: #33
# ran seed 0 and restored 394 atoms against this run's 463, and the
# recording additionally reads every atom pickle back off disk. Budget a
# full half hour for a checkpoint run.
[budget]
wall_s = 1641.2
benchmark_wall_s = 1167.6
benchmark_source = "benchmarks/results/2026-08-24-xps13-9360/cg-max-iter-200/benchmark.json"
marker = "slow"
runs_on = "carve checkpoints and nightly CI (#19)"

# Recorded for diagnosis only. The goldens are expected to reproduce
# across machines within the tolerances above.
[machine]
hostname = "amael-XPS-13-9360"
platform = "Linux-7.0.0-29-generic-x86_64-with-glibc2.43"
python = "3.13.9"
numpy = "2.3.5"
